[workspace]
members = [
    "crates/domain",
    "crates/bakery",
    "apps/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/opti-ai"

[workspace.dependencies]
good_lp = { version = "=1.15.3", default-features = false, features = ["highs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
